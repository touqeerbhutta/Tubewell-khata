<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5d6b">
<title>Tubewell Khata</title>
<script src="supabase.js"></script>
<style>
:root{--p:#0b5d6b;--soft:#e6f2f4;--bg:#f2f5f7;--ink:#122428;--mu:#6b7c80;--ln:#e1e8ea;--red:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.4 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
[hidden]{display:none!important}
input,select,button{font:inherit}
input,select{width:100%;padding:13px;border:1px solid var(--ln);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--p);border-color:transparent}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:12px 0 5px}
.btn{border:0;border-radius:12px;padding:13px 16px;background:var(--p);color:#fff;font-weight:700;width:100%;margin-top:10px}
.btn.s{background:var(--soft);color:var(--p)}.btn.d{background:#fdecea;color:var(--red)}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#0b5d6b,#0e7490);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 12px 12px;display:flex;align-items:center;gap:6px}
header h1{font-size:18px;margin:0;flex:1;padding-left:4px}
header button{background:none;border:0;color:#fff;font-weight:600;opacity:.9;padding:6px 8px}
#back{font-size:30px;line-height:1;padding:0 8px}
.stat{font-size:11px;font-weight:700;border-radius:10px;padding:3px 8px;background:#ffffff2e}
.stat.off{background:#c0392b}.stat.wait{background:#c26a1b}
main{padding:14px 14px 170px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;padding:9px;border:0;background:none;color:var(--mu);font-weight:600;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--p)}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));background:var(--p);color:#fff;border:0;border-radius:30px;padding:15px 22px;font-weight:700;box-shadow:0 6px 18px #0b5d6b66;z-index:6}
.hero{background:linear-gradient(135deg,#0b5d6b,#0e7490);color:#fff;border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 8px 22px #0b5d6b33}
.hero small{opacity:.85;display:block;font-size:12px}
.big{font-size:34px;font-weight:800;margin:4px 0 6px}
.hrow{display:flex;justify-content:space-between;opacity:.9;font-size:13px}
.hhead{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.hhead b{font-size:19px;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>div{background:#ffffff1f;border-radius:14px;padding:12px}
.two b{font-size:17px;display:block;margin-top:2px}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:10px}
.card[data-c]:active,.card[data-e]:active{background:var(--soft)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.end{display:flex;align-items:center;gap:6px;text-align:right}
.chev{color:var(--mu);font-size:22px}
.mu{color:var(--mu);font-size:13px}
.av{width:44px;height:44px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
.sec{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px}
.sec h2{font-size:13px;margin:0;color:var(--mu);text-transform:uppercase;letter-spacing:.6px}
.lnk{background:none;border:0;color:var(--p);font-weight:700}
.chips{display:flex;gap:8px;margin-bottom:4px}
.chips button{border:1px solid var(--ln);background:#fff;border-radius:20px;padding:8px 16px;color:var(--mu);font-weight:600}
.chips .on{background:var(--p);color:#fff;border-color:var(--p)}
.day{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--mu);margin:16px 2px 8px}
.empty{text-align:center;color:var(--mu);padding:34px 10px}
.two2{display:grid;gap:4px;margin-top:22px}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:9}
.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prev{background:var(--soft);color:var(--p);border-radius:14px;padding:14px;margin-top:14px;font-weight:700;text-align:center}
#auth{min-height:100vh;display:flex;align-items:center;padding:20px;background:linear-gradient(160deg,#0b5d6b,#0e7490)}
#auth .card{width:100%;max-width:380px;margin:auto;padding:24px;border-radius:22px}
.logo{width:58px;height:58px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:#122428;color:#fff;padding:11px 18px;border-radius:22px;z-index:20;max-width:90%;text-align:center}
</style></head>
<body>
<div id="auth" hidden><div class="card">
<div class="logo">💧</div>
<h2 style="margin:0 0 2px;color:var(--p)">Tubewell Khata</h2>
<div class="mu">Login karein ya naya account banayen</div>
<label>Username</label><input id="u" autocapitalize="none" autocomplete="username">
<label>Password (kam az kam 6 harf)</label><input id="pw" type="password" autocomplete="current-password">
<button class="btn" id="bLogin">Login</button>
<button class="btn s" id="bSign">Naya account banayen</button>
</div></div>

<div id="app" hidden>
<header><button id="back" hidden>‹</button><h1 id="ttl">Tubewell Khata</h1><span id="stat" class="stat"></span><button id="bOut">Logout</button></header>
<main id="main"></main>
<button class="fab" id="fab">+ Nayi entry</button>
<nav>
<button data-v="khata" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>Khate</button>
<button data-v="daily"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Rozana</button>
</nav>

<div class="modal" id="modal" hidden><div class="sheet">
<h3 id="mT">Nayi entry</h3>
<label>Banda</label><select id="fc"></select>
<label>Tarikh</label><input type="date" id="fd">
<div class="g2"><div><label>Kab chalai</label><input type="time" id="fs"></div><div><label>Kab band ki</label><input type="time" id="fe"></div></div>
<label>Rate (Rs per ghanta)</label><input type="number" id="fr" inputmode="decimal">
<label>Paise (riyat ke liye khud badal sakte hain)</label><input type="number" id="fa" inputmode="decimal">
<div class="prev" id="prev">-</div>
<button class="btn" id="fSave">Save karein</button>
<button class="btn d" id="fDel" hidden>Delete karein</button>
<button class="btn s" id="fX">Band karein</button>
</div></div>

<div class="modal" id="cm" hidden><div class="sheet">
<h3 id="cmT">Naya banda</h3>
<label>Naam</label><input id="cmN">
<label>Rate (Rs per ghanta)</label><input id="cmR" type="number" inputmode="decimal">
<label>Pehle ka hisaab (Rs, purani book se)</label><input id="cmO" type="number" inputmode="decimal" placeholder="0">
<button class="btn" id="cmS">Save karein</button>
<button class="btn s" id="cmX">Band karein</button>
</div></div>
</div>
<div id="toast" hidden></div>

<script>
const SB_URL='https://ffxwoxdtjxajcrkluofz.supabase.co', SB_KEY='sb_publishable_poiE0k3vg5nHxji7rr7K7Q_o839zR29';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s), p2=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const tm=iso=>new Date(iso).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const fd=d=>new Date(d+'T00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const dur=t=>{const m=Math.round(t/60000);return Math.floor(m/60)+' ghanta '+p2(m%60)+' min'};
const rs=n=>'Rs '+Math.round(n).toLocaleString('en-IN');
const ms=e=>new Date(e.end_at)-new Date(e.start_at);
const amt=e=>e.amount!=null?Math.round(e.amount):Math.round(ms(e)/3600000*e.rate);
const disc=e=>e.amount!=null&&Math.round(e.amount)!==Math.round(ms(e)/3600000*e.rate);
const sum=l=>l.reduce((a,e)=>{a.ms+=ms(e);a.m+=amt(e);return a},{ms:0,m:0});
const COL=['#0b5d6b','#2e7d32','#6a4c93','#c26a1b','#1565c0','#ad1457'];
const col=n=>COL[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%COL.length];
const av=n=>`<span class="av" style="background:${col(n)}">${esc((n.trim()[0]||'?').toUpperCase())}</span>`;
const byName=(a,b)=>a.name.localeCompare(b.name);
const cn=id=>(customers.find(c=>c.id===id)||{}).name||'';
const uid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});
const LS='tk_data';
let manual=false,payEdit=null;
let customers=[],entries=[],payments=[],Q=[],view='khata',cid=null,flt='all',day=ymd(new Date()),editId=null,custEdit=null,flushing=false,ch=null;
const cs=c=>{const s=sum(entries.filter(e=>e.customer_id===c.id)),o=+c.opening||0;return{ms:s.ms,n:s.m,o,m:s.m+o}};

function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,2600)}
function setStat(){const s=$('#stat'),off=!navigator.onLine;s.textContent=(off?'Offline':'Online')+(Q.length?' · '+Q.length+' baqi':'');s.className='stat '+(off?'off':Q.length?'wait':'on')}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({customers,entries,payments,Q}))}catch(e){}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d){customers=d.customers||[];entries=d.entries||[];payments=d.payments||[];Q=d.Q||[]}}catch(e){}}
const isNet=er=>!navigator.onLine||/fetch|network/i.test((er&&er.message)||'');

/* ---- login ---- */
const mail=u=>u.trim().toLowerCase().replace(/\s+/g,'')+'@tubewell.app';
async function doAuth(signup){
  const u=$('#u').value, pw=$('#pw').value;
  if(!u.trim()||pw.length<6) return toast('Username likhein, password kam az kam 6 harf');
  const fn=signup?sb.auth.signUp.bind(sb.auth):sb.auth.signInWithPassword.bind(sb.auth);
  const {error}=await fn({email:mail(u),password:pw});
  if(error) return toast(error.message);
  boot();
}
$('#bLogin').onclick=()=>doAuth(false);
$('#bSign').onclick=()=>doAuth(true);
$('#bOut').onclick=async()=>{
  if(Q.length&&!confirm(Q.length+' tabdeeliyan abhi sync nahi hui, logout se zaya ho jayengi. Pakka?')) return;
  try{await sb.auth.signOut()}catch(e){}
  if(ch){sb.removeChannel(ch);ch=null}
  localStorage.removeItem('tk_uid');localStorage.removeItem(LS);
  customers=[];entries=[];payments=[];Q=[];boot();
};
async function boot(){
  const {data:{session},error}=await sb.auth.getSession();
  const off=!session&&localStorage.getItem('tk_uid')&&(!navigator.onLine||(error&&/fetch|network/i.test(error.message||'')));
  const ok=!!session||!!off;
  $('#auth').hidden=ok; $('#app').hidden=!ok;
  if(!ok) return;
  if(session){
    const old=localStorage.getItem('tk_uid');
    if(old&&old!==session.user.id) localStorage.removeItem(LS);
    localStorage.setItem('tk_uid',session.user.id);
  }
  loadLocal(); view='khata'; day=ymd(new Date()); render();
  if(session){listen(); await loadAll()}
}

/* ---- sync ---- */
async function flush(){
  if(flushing||!Q.length) return; flushing=true;
  try{
    const {data:{session}}=await sb.auth.getSession(); if(!session) return;
    while(Q.length){
      const {t,op,row}=Q[0]; let r;
      if(op==='ins') r=await sb.from(t).upsert(row);
      else if(op==='upd'){const {id,...rest}=row; r=await sb.from(t).update(rest).eq('id',id)}
      else r=await sb.from(t).delete().eq('id',row.id);
      if(r.error){ if(isNet(r.error)) break; toast('Sync masla: '+r.error.message) }
      Q.shift(); saveLocal(); setStat();
    }
  }catch(e){}finally{flushing=false;setStat()}
}
async function loadAll(){
  await flush();
  if(Q.length) return render();
  const c=await sb.from('customers').select('*').order('name');
  if(c.error) return render();
  let all=[],from=0;
  while(true){
    const r=await sb.from('entries').select('*').order('start_at',{ascending:false}).range(from,from+999);
    if(r.error) return render();
    all=all.concat(r.data); if(r.data.length<1000) break; from+=1000;
  }
  const pr=await sb.from('payments').select('*').order('paid_at',{ascending:false});
  if(pr.error&&isNet(pr.error)) return render();
  if(!pr.error) payments=pr.data;
  customers=c.data; entries=all; saveLocal(); render();
}
function mut(t,op,row){
  const arr=t==='customers'?customers:t==='payments'?payments:entries, i=arr.findIndex(x=>x.id===row.id);
  if(op==='del'){if(i>-1)arr.splice(i,1);if(t==='customers')entries=entries.filter(e=>e.customer_id!==row.id)}
  else if(i>-1) Object.assign(arr[i],row); else arr.push(Object.assign({},row));
  if(t==='customers') customers.sort(byName);
  Q.push({t,op,row}); saveLocal(); render(); flush();
}
function listen(){
  if(ch) return;
  ch=sb.channel('tk');
  ['customers','entries','payments'].forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},p=>{
    const arr=t==='customers'?customers:t==='payments'?payments:entries, row=(p.new&&p.new.id)?p.new:p.old;
    if(!row||!row.id) return;
    const i=arr.findIndex(x=>x.id===row.id);
    if(p.eventType==='DELETE'){if(i>-1)arr.splice(i,1);if(t==='customers')entries=entries.filter(e=>e.customer_id!==row.id)}
    else if(i>-1) arr[i]=p.new; else arr.push(p.new);
    if(t==='customers') customers.sort(byName);
    saveLocal(); render();
  }));
  ch.subscribe();
}

/* ---- screens ---- */
function render(){
  setStat();
  $('#back').hidden=view!=='detail';
  $('#ttl').textContent=view==='detail'?cn(cid):'Tubewell Khata';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(view==='detail'?'khata':view)));
  ({khata:rKhata,daily:rDaily,detail:rDetail})[view]();
}
const go=v=>{view=v;render();scrollTo(0,0)};
const bindE=()=>document.querySelectorAll('[data-e]').forEach(el=>el.onclick=()=>openForm(entries.find(x=>x.id===el.dataset.e)));

function rKhata(){
  const t=sum(entries), tot=t.m+customers.reduce((a,c)=>a+(+c.opening||0),0);
  let h=`<div class="hero"><small>Kul hisaab (sab bande)</small><div class="big">${rs(tot)}</div><div class="hrow"><span>${dur(t.ms)}</span><span>${customers.length} bande</span></div></div>
  <div class="sec"><h2>Bandon ke khate</h2><button class="lnk" id="addC">+ Naya banda</button></div>`;
  h+=customers.length?customers.map(c=>{const k=cs(c);
    return `<div class="card row" data-c="${c.id}">${av(c.name)}<div class="grow"><b>${esc(c.name)}</b><div class="mu">${dur(k.ms)} &middot; Rs ${c.rate}/ghanta</div></div><div class="end"><b>${rs(k.m)}</b><span class="chev">›</span></div></div>`}).join('')
    :'<div class="empty">Abhi koi banda nahi.<br>Upar "+ Naya banda" dabayen.</div>';
  $('#main').innerHTML=h;
  $('#addC').onclick=()=>openCust(null);
  document.querySelectorAll('[data-c]').forEach(el=>el.onclick=()=>{cid=el.dataset.c;flt='all';go('detail')});
}

function inFlt(e){
  const d=new Date(e.start_at),n=new Date();
  if(flt==='today') return ymd(d)===ymd(n);
  if(flt==='month') return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth();
  return true;
}
function rDetail(){
  const c=customers.find(x=>x.id===cid);
  if(!c){view='khata';return render()}
  const k=cs(c), list=entries.filter(e=>e.customer_id===cid&&inFlt(e)), s=sum(list), groups={}, all=flt==='all';
  list.forEach(e=>{const d=ymd(new Date(e.start_at));(groups[d]=groups[d]||[]).push(e)});
  let h=`<div class="hero"><div class="hhead">${av(c.name)}<div><b>${esc(c.name)}</b><small>Rs ${c.rate} per ghanta</small></div></div>
  <div class="two"><div><small>Total pani</small><b>${dur(s.ms)}</b></div><div><small>Total paise</small><b>${rs(all?k.m:s.m)}</b></div></div>
  ${all&&k.o>0?`<small style="margin-top:10px">Pehle ka ${rs(k.o)} + naya ${rs(k.n)}</small>`:''}</div>
  <div class="chips">${[['all','Sab'],['month','Is mahine'],['today','Aaj']].map(([x,l])=>`<button class="${flt===x?'on':''}" data-f="${x}">${l}</button>`).join('')}</div>`;
  const keys=Object.keys(groups).sort().reverse();
  h+=keys.length?keys.map(d=>{
    const g=groups[d].slice().sort((a,b)=>new Date(a.start_at)-new Date(b.start_at)), gs=sum(g);
    return `<div class="day"><span>${fd(d)}</span><span>${dur(gs.ms)} &middot; ${rs(gs.m)}</span></div>`+
    g.map(e=>`<div class="card row" data-e="${e.id}"><div class="grow"><b>${tm(e.start_at)} se ${tm(e.end_at)}</b><div class="mu">${dur(ms(e))} &middot; Rs ${e.rate}/ghanta${disc(e)?' &middot; riyat':''}</div></div><b>${rs(amt(e))}</b></div>`).join('');
  }).join(''):'<div class="empty">Is muddat mein koi entry nahi.</div>';
  if(all&&k.o>0) h+=`<div class="day"><span>PURANA HISAAB</span><span></span></div><div class="card row" id="opn"><div class="grow"><b>Pehle ka hisaab</b><div class="mu">Purani book se (tap karke badlein)</div></div><b>${rs(k.o)}</b></div>`;
  h+=`<div class="two2"><button class="btn s" id="eC">Naam / rate / purana hisaab badlein</button><button class="btn d" id="dC">Banda hatayen</button></div>`;
  $('#main').innerHTML=h;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{flt=b.dataset.f;render()});
  $('#eC').onclick=()=>openCust(c);
  if($('#opn')) $('#opn').onclick=()=>openCust(c);
  $('#dC').onclick=()=>{
    if(!confirm('Is bande ka sara hisaab bhi delete ho jayega. Pakka?')) return;
    view='khata'; mut('customers','del',{id:c.id});
  };
  bindE();
}
function rDaily(){
  const list=entries.filter(e=>ymd(new Date(e.start_at))===day).sort((a,b)=>new Date(a.start_at)-new Date(b.start_at)), s=sum(list);
  $('#main').innerHTML=`<input type="date" id="day" value="${day}" style="margin-bottom:14px">
  <div class="hero"><div class="two"><div><small>Total waqt</small><b>${dur(s.ms)}</b></div><div><small>Total paise</small><b>${rs(s.m)}</b></div></div></div>`+
  (list.length?list.map(e=>`<div class="card row" data-e="${e.id}">${av(cn(e.customer_id))}<div class="grow"><b>${esc(cn(e.customer_id))}</b><div class="mu">${tm(e.start_at)} se ${tm(e.end_at)} &middot; ${dur(ms(e))}${disc(e)?' &middot; riyat':''}</div></div><b>${rs(amt(e))}</b></div>`).join(''):'<div class="empty">Is din ki koi entry nahi.</div>');
  $('#day').onchange=ev=>{day=ev.target.value||ymd(new Date());rDaily()};
  bindE();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#back').onclick=()=>go('khata');

/* ---- banda form ---- */
function openCust(c){
  custEdit=c?c.id:null;
  $('#cmT').textContent=c?'Banda theek karein':'Naya banda';
  $('#cmN').value=c?c.name:''; $('#cmR').value=c?c.rate:''; $('#cmO').value=c&&c.opening?c.opening:'';
  $('#cm').hidden=false;
}
$('#cmX').onclick=()=>$('#cm').hidden=true;
$('#cmS').onclick=()=>{
  const name=$('#cmN').value.trim(), rate=parseFloat($('#cmR').value), opening=parseFloat($('#cmO').value)||0;
  if(!name||isNaN(rate)) return toast('Naam aur rate likhein');
  $('#cm').hidden=true;
  if(custEdit){mut('customers','upd',{id:custEdit,name,rate,opening});toast('Badal gaya (purani entries ka rate nahi badla)')}
  else{mut('customers','ins',{id:uid(),name,rate,opening});toast('Banda add ho gaya')}
};

/* ---- entry form ---- */
function calc(keep){
  const d=$('#fd').value,s=$('#fs').value,e=$('#fe').value,r=parseFloat($('#fr').value);
  if(!d||!s||!e||isNaN(r)){$('#prev').textContent='-';return null}
  const a=new Date(d+'T'+s), b=new Date(d+'T'+e);
  if(b<=a) b.setDate(b.getDate()+1);
  const t=b-a, auto=Math.round(t/3600000*r);
  if(!manual&&!keep) $('#fa').value=auto;
  const fin=manual?(parseFloat($('#fa').value)||0):auto;
  $('#prev').textContent=dur(t)+'  =  '+rs(fin)+(manual&&fin!==auto?'  (riyat '+rs(auto-fin)+')':'');
  return {a,b,r,fin};
}
['fd','fs','fe','fr'].forEach(i=>$('#'+i).oninput=()=>calc());
$('#fa').oninput=()=>{manual=$('#fa').value!=='';calc(true)};
$('#fa').onblur=()=>calc();
$('#fc').onchange=()=>{const c=customers.find(x=>x.id===$('#fc').value);if(c)$('#fr').value=c.rate;calc()};
function openForm(e){
  if(!customers.length){toast('Pehle banda add karein');return}
  editId=e?e.id:null;
  $('#mT').textContent=e?'Entry theek karein':'Nayi entry';
  $('#fc').innerHTML=customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  $('#fDel').hidden=!e;
  if(e){
    const a=new Date(e.start_at),b=new Date(e.end_at);
    $('#fc').value=e.customer_id; $('#fd').value=ymd(a);
    $('#fs').value=p2(a.getHours())+':'+p2(a.getMinutes());
    $('#fe').value=p2(b.getHours())+':'+p2(b.getMinutes()); $('#fr').value=e.rate;
  }else{
    const c=(view==='detail'&&customers.find(x=>x.id===cid))||customers[0];
    $('#fc').value=c.id; $('#fd').value=view==='daily'?day:ymd(new Date());
    $('#fs').value=''; $('#fe').value=''; $('#fr').value=c.rate;
  }
  manual=!!(e&&e.amount!=null); $('#fa').value=manual?e.amount:'';
  calc(); $('#modal').hidden=false;
}
$('#fab').onclick=()=>openForm(null);
$('#fX').onclick=()=>$('#modal').hidden=true;
$('#fSave').onclick=()=>{
  const v=calc(); if(!v) return toast('Sab cheezein bharein');
  const row={customer_id:$('#fc').value,start_at:v.a.toISOString(),end_at:v.b.toISOString(),rate:v.r,amount:manual?v.fin:null};
  if(view==='daily') day=$('#fd').value;
  $('#modal').hidden=true;
  mut('entries',editId?'upd':'ins',Object.assign({id:editId||uid()},row));
  toast('Save ho gaya');
};
$('#fDel').onclick=()=>{
  if(!confirm('Ye entry delete karein?')) return;
  $('#modal').hidden=true; mut('entries','del',{id:editId});
};

window.addEventListener('online',()=>{setStat();loadAll()});
window.addEventListener('offline',setStat);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#app').hidden)loadAll()});
setInterval(()=>{if(Q.length)flush()},15000);
const ps=c=>{
  const k=cs(c),p=payments.filter(x=>x.customer_id===c.id),ap=p.filter(x=>x.applied);
  const pa=ap.reduce((a,x)=>a+x.amount,0), pp=p.filter(x=>!x.applied).reduce((a,x)=>a+x.amount,0);
  const pms=ap.reduce((a,x)=>a+x.amount/(x.rate||c.rate||1)*3600000,0);
  return{jama:pa+pp,pa,pp,bq:k.m-pa,bms:Math.max(0,k.ms-pms)};
};

function rKhata(){
  let tb=0,tj=0,tq=0,tms=0;
  customers.forEach(c=>{const k=cs(c),q=ps(c);tb+=k.m;tj+=q.jama;tq+=q.bq;tms+=k.ms});
  let h=`<div class="hero"><small>Kul baqaya (sab bande)</small><div class="big">${rs(tq)}</div>
  <div class="hrow"><span>Hisaab ${rs(tb)}</span><span>Jama ${rs(tj)}</span></div>
  <div class="hrow" style="margin-top:4px"><span>${dur(tms)}</span><span>${customers.length} bande</span></div></div>
  <div class="sec"><h2>Bandon ke khate</h2><button class="lnk" id="addC">+ Naya banda</button></div>`;
  h+=customers.length?customers.map(c=>{const k=cs(c),q=ps(c);
    return `<div class="card row" data-c="${c.id}">${av(c.name)}<div class="grow"><b>${esc(c.name)}</b><div class="mu">${dur(k.ms)} &middot; Hisaab ${rs(k.m)}</div></div><div class="end"><div><b>${rs(q.bq)}</b><div class="mu">baqaya</div></div><span class="chev">›</span></div></div>`}).join('')
    :'<div class="empty">Abhi koi banda nahi.<br>Upar "+ Naya banda" dabayen.</div>';
  $('#main').innerHTML=h;
  $('#addC').onclick=()=>openCust(null);
  document.querySelectorAll('[data-c]').forEach(el=>el.onclick=()=>{cid=el.dataset.c;flt='all';go('detail')});
}

function rDetail(){
  const c=customers.find(x=>x.id===cid);
  if(!c){view='khata';return render()}
  const k=cs(c), q=ps(c), all=flt==='all';
  const list=entries.filter(e=>e.customer_id===cid&&inFlt(e)), s=sum(list);
  const pl=payments.filter(x=>x.customer_id===cid&&inFlt({start_at:x.paid_at}));
  const groups={}, G=d=>groups[d]=groups[d]||{e:[],p:[]};
  list.forEach(e=>G(ymd(new Date(e.start_at))).e.push(e));
  pl.forEach(x=>G(ymd(new Date(x.paid_at))).p.push(x));
  let h=`<div class="hero"><div class="hhead">${av(c.name)}<div><b>${esc(c.name)}</b><small>Rs ${c.rate} per ghanta</small></div></div>
  <div class="two"><div><small>Total pani</small><b>${dur(s.ms)}</b></div><div><small>Total paise</small><b>${rs(all?k.m:s.m)}</b></div></div>
  ${all?`<div class="two" style="margin-top:10px"><div><small>Jama pesay</small><b>${rs(q.jama)}</b></div><div><small>Baqaya</small><b>${rs(q.bq)}</b><small>${dur(q.bms)} pani</small></div></div>`:''}
  ${all&&k.o>0?`<small style="margin-top:10px">Pehle ka ${rs(k.o)} + naya ${rs(k.n)}</small>`:''}
  ${all&&q.pp>0?`<small style="margin-top:6px">${rs(q.pp)} jama hain, abhi minus nahi hue</small>`:''}</div>
  <button class="btn" id="payBtn" style="margin:0 0 12px">+ Pesay jama karein</button>
  ${q.pp>0?`<button class="btn s" id="applyAll" style="margin:0 0 12px">Jama pesay ab minus karein (${rs(q.pp)})</button>`:''}
  <div class="chips">${[['all','Sab'],['month','Is mahine'],['today','Aaj']].map(([x,l])=>`<button class="${flt===x?'on':''}" data-f="${x}">${l}</button>`).join('')}</div>`;
  const keys=Object.keys(groups).sort().reverse();
  h+=keys.length?keys.map(d=>{
    const g=groups[d], es=g.e.slice().sort((a,b)=>new Date(a.start_at)-new Date(b.start_at)), gs=sum(es);
    return `<div class="day"><span>${fd(d)}</span><span>${es.length?dur(gs.ms)+' &middot; '+rs(gs.m):''}</span></div>`+
    es.map(e=>`<div class="card row" data-e="${e.id}"><div class="grow"><b>${tm(e.start_at)} se ${tm(e.end_at)}</b><div class="mu">${dur(ms(e))} &middot; Rs ${e.rate}/ghanta${disc(e)?' &middot; riyat':''}</div></div><b>${rs(amt(e))}</b></div>`).join('')+
    g.p.map(x=>`<div class="card row" data-p="${x.id}"><div class="grow"><b style="color:#1f7a3d">Jama pesay</b><div class="mu">${x.applied?'Hisaab se minus':'Abhi minus nahi'} &middot; ${dur(x.amount/(x.rate||c.rate||1)*3600000)}</div></div><b style="color:#1f7a3d">+ ${rs(x.amount)}</b></div>`).join('');
  }).join(''):'<div class="empty">Is muddat mein koi entry nahi.</div>';
  if(all&&k.o>0) h+=`<div class="day"><span>PURANA HISAAB</span><span></span></div><div class="card row" id="opn"><div class="grow"><b>Pehle ka hisaab</b><div class="mu">Purani book se (tap karke badlein)</div></div><b>${rs(k.o)}</b></div>`;
  h+=`<div class="two2"><button class="btn s" id="eC">Naam / rate / purana hisaab badlein</button><button class="btn d" id="dC">Banda hatayen</button></div>`;
  $('#main').innerHTML=h;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{flt=b.dataset.f;render()});
  document.querySelectorAll('[data-p]').forEach(el=>el.onclick=()=>openPay(payments.find(x=>x.id===el.dataset.p)));
  $('#payBtn').onclick=()=>openPay(null);
  if($('#applyAll')) $('#applyAll').onclick=()=>{
    if(!confirm('Jama pesay hisaab se minus kar dein?')) return;
    payments.filter(x=>x.customer_id===cid&&!x.applied).forEach(x=>mut('payments','upd',{id:x.id,applied:true}));
    toast('Minus ho gaye');
  };
  $('#eC').onclick=()=>openCust(c);
  if($('#opn')) $('#opn').onclick=()=>openCust(c);
  $('#dC').onclick=()=>{
    if(!confirm('Is bande ka sara hisaab bhi delete ho jayega. Pakka?')) return;
    view='khata'; mut('customers','del',{id:c.id});
  };
  bindE();
}

document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="pm" hidden><div class="sheet">
<h3 id="pmT">Pesay jama karein</h3>
<label>Banda</label><select id="pc"></select>
<label>Tarikh</label><input type="date" id="pd">
<label>Rakam (Rs)</label><input type="number" id="pa" inputmode="decimal">
<label style="display:flex;gap:10px;align-items:center;margin-top:16px;font-size:14px;color:var(--ink)"><input type="checkbox" id="pk" style="width:22px;height:22px"> Hisaab se minus karein (pani ke ghantay kam hon)</label>
<div class="prev" id="pprev">-</div>
<button class="btn" id="pSave">Save karein</button>
<button class="btn d" id="pDel" hidden>Delete karein</button>
<button class="btn s" id="pX">Band karein</button>
</div></div>`);

function pcalc(){
  const c=customers.find(z=>z.id===$('#pc').value), a=parseFloat($('#pa').value);
  if(!c||isNaN(a)||a<=0){$('#pprev').textContent='-';return null}
  $('#pprev').textContent=rs(a)+' = '+dur(a/(c.rate||1)*3600000)+($('#pk').checked?' minus hongay':' (abhi minus nahi hongay)');
  return {c,a};
}
function openPay(x){
  if(!customers.length){toast('Pehle banda add karein');return}
  payEdit=x?x.id:null;
  $('#pmT').textContent=x?'Jama pesay theek karein':'Pesay jama karein';
  $('#pc').innerHTML=customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  $('#pc').value=x?x.customer_id:((view==='detail'&&cid)?cid:customers[0].id);
  $('#pd').value=x?ymd(new Date(x.paid_at)):ymd(new Date());
  $('#pa').value=x?x.amount:''; $('#pk').checked=x?!!x.applied:true;
  $('#pDel').hidden=!x; pcalc(); $('#pm').hidden=false;
}
$('#pc').onchange=pcalc; $('#pa').oninput=pcalc; $('#pk').onchange=pcalc;
$('#pX').onclick=()=>$('#pm').hidden=true;
$('#pSave').onclick=()=>{
  const v=pcalc(); if(!v) return toast('Rakam likhein');
  const old=payEdit&&payments.find(z=>z.id===payEdit);
  const row={customer_id:v.c.id,amount:v.a,paid_at:new Date($('#pd').value+'T12:00').toISOString(),
    rate:(old&&old.customer_id===v.c.id)?old.rate:v.c.rate,applied:$('#pk').checked};
  $('#pm').hidden=true;
  mut('payments',payEdit?'upd':'ins',Object.assign({id:payEdit||uid()},row));
  toast('Save ho gaya');
};
$('#pDel').onclick=()=>{
  if(!confirm('Ye jama entry delete karein?')) return;
  $('#pm').hidden=true; mut('payments','del',{id:payEdit});
};

boot();
</script>
