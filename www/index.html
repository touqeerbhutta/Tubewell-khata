<script>
const SB_URL='https://ffxwoxdtjxajcrkluofz.supabase.co', SB_KEY='sb_publishable_poiE0k3vg5nHxji7rr7K7Q_o839zR29';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s), p2=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const _tf=new Intl.DateTimeFormat([], {hour:'numeric',minute:'2-digit'});
const tm=iso=>_tf.format(new Date(iso));
const fd=d=>new Date(d+'T00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const dur=t=>{const m=Math.round(t/60000);return Math.floor(m/60)+' ghanta '+p2(m%60)+' min'};
const _nf=new Intl.NumberFormat('en-IN');
const rs=n=>'Rs '+_nf.format(Math.round(n));
const _msC=new WeakMap();
const ms=e=>{const k=e.start_at+'|'+e.end_at,c=_msC.get(e);if(c&&c.k===k)return c.m;const m=new Date(e.end_at)-new Date(e.start_at);_msC.set(e,{k,m});return m};
const isRun=e=>ms(e)===0;
const et=e=>isRun(e)?'chal raha ha':tm(e.end_at);
const amt=e=>e.amount!=null?Math.round(e.amount):Math.round(ms(e)/3600000*e.rate);
const disc=e=>e.amount!=null&&Math.round(e.amount)!==Math.round(ms(e)/3600000*e.rate);
const sum=l=>l.reduce((a,e)=>{a.ms+=ms(e);a.m+=amt(e);return a},{ms:0,m:0});
const COL=['#0b5d6b','#2e7d32','#6a4c93','#c26a1b','#1565c0','#ad1457'];
const col=n=>COL[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%COL.length];
const avOld=n=>`<span class="av" style="background:${col(n)}">${esc((n.trim()[0]||'?').toUpperCase())}</span>`;
const byName=(a,b)=>a.name.localeCompare(b.name);
const cn=id=>(customers.find(c=>c.id===id)||{}).name||'';
const uid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});
const LS='tk_data';
let manual=false,payEdit=null;
let customers=[],entries=[],payments=[],Q=[],view='khata',cid=null,flt='all',day=ymd(new Date()),editId=null,custEdit=null,flushing=false,ch=null;
let _inR=false,_grpE=null,_csM=null;
const grpE=()=>{if(!_grpE){_grpE=new Map();entries.forEach(e=>{let a=_grpE.get(e.customer_id);if(!a)_grpE.set(e.customer_id,a=[]);a.push(e)})}return _grpE};
const cs=c=>{
  if(_inR&&_csM.has(c.id)) return _csM.get(c.id);
  const s=sum(_inR?(grpE().get(c.id)||[]):entries.filter(e=>e.customer_id===c.id)),o=+c.opening||0;
  const r={ms:s.ms,n:s.m,o,m:s.m+o}; if(_inR) _csM.set(c.id,r); return r;
};

function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,2600)}
function setStat(){const s=$('#stat'),off=!navigator.onLine;s.textContent=(off?'Offline':'Online')+(Q.length?' · '+Q.length+' baqi':'');s.className='stat '+(off?'off':Q.length?'wait':'on')}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({customers,entries,payments,Q}))}catch(e){}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d){customers=d.customers||[];entries=d.entries||[];payments=d.payments||[];Q=d.Q||[]}}catch(e){}}
const isNet=er=>!navigator.onLine||/fetch|network/i.test((er&&er.message)||'');

/* ---- login ---- */
const mail=u=>u.trim().toLowerCase().replace(/\s+/g,'')+'@tubewell.app';
$('#bLogin').onclick=()=>doAuth(false);
$('#bSign').onclick=()=>doAuth(true);
$('#bOut').onclick=async()=>{
  if(Q.length&&!confirm(Q.length+' tabdeeliyan abhi sync nahi hui, logout se zaya ho jayengi. Pakka?')) return;
  try{await sb.auth.signOut()}catch(e){}
  if(ch){sb.removeChannel(ch);ch=null}
  localStorage.removeItem('tk_uid');localStorage.removeItem(LS);
  customers=[];entries=[];payments=[];Q=[];boot();
};
async function boot(){
  const {data:{session},error}=await sb.auth.getSession();
  const off=!session&&localStorage.getItem('tk_uid')&&(!navigator.onLine||(error&&/fetch|network/i.test(error.message||'')));
  const ok=!!session||!!off;
  $('#auth').hidden=ok; $('#app').hidden=!ok;
  if(!ok) return;
  if(session){
    const old=localStorage.getItem('tk_uid');
    if(old&&old!==session.user.id) localStorage.removeItem(LS);
    localStorage.setItem('tk_uid',session.user.id);
  }
  loadLocal(); view='khata'; day=ymd(new Date()); render();
  if(session){listen(); await loadAll()}
}

/* ---- sync ---- */
let _mseq=0,_lastLoad=0;
async function loadAll(){
  await flush();
  if(Q.length) return render();
  const s0=_mseq;
  const c=await sb.from('customers').select('*').order('name');
  if(c.error) return render();
  let all=[],from=0;
  while(true){
    const r=await sb.from('entries').select('*').order('start_at',{ascending:false}).range(from,from+999);
    if(r.error) return render();
    all=all.concat(r.data); if(r.data.length<1000) break; from+=1000;
  }
  const pr=await sb.from('payments').select('*').order('paid_at',{ascending:false});
  if(pr.error&&isNet(pr.error)) return render();
  if(!pr.error) payments=pr.data;
  if(_mseq!==s0||Q.length) return render();
  customers=c.data; entries=all; _lastLoad=Date.now(); saveLocal(); render();
}
function mut(t,op,row){
  _mseq++;
  const arr=t==='customers'?customers:t==='payments'?payments:entries, i=arr.findIndex(x=>x.id===row.id);
  if(op==='del'){if(i>-1)arr.splice(i,1);if(t==='customers')entries=entries.filter(e=>e.customer_id!==row.id)}
  else if(i>-1) Object.assign(arr[i],row); else arr.push(Object.assign({},row));
  if(t==='customers') customers.sort(byName);
  Q.push({t,op,row}); saveLocal(); render(); flush();
}
function listen(){
  if(ch) return;
  ch=sb.channel('tk');
  ['customers','entries','payments'].forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},p=>{
    const arr=t==='customers'?customers:t==='payments'?payments:entries, row=(p.new&&p.new.id)?p.new:p.old;
    if(!row||!row.id) return;
    const i=arr.findIndex(x=>x.id===row.id);
    if(p.eventType==='DELETE'){if(i>-1)arr.splice(i,1);if(t==='customers')entries=entries.filter(e=>e.customer_id!==row.id)}
    else if(i>-1) arr[i]=p.new; else arr.push(p.new);
    if(t==='customers') customers.sort(byName);
    saveLocal(); render();
  }));
  ch.subscribe();
}

/* ---- screens ---- */
function render(){
  setStat();
  $('#back').hidden=view!=='detail';
  $('#ttl').textContent=view==='detail'?cn(cid):'Tubewell Khata';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(view==='detail'?'khata':view)));
  ({khata:rKhata,daily:rDaily,detail:rDetail})[view]();
}
const go=v=>{view=v;render();scrollTo(0,0)};
const bindE=()=>document.querySelectorAll('[data-e]').forEach(el=>el.onclick=()=>openForm(entries.find(x=>x.id===el.dataset.e)));

function inFlt(e){
  const d=new Date(e.start_at),n=new Date();
  if(flt==='today') return ymd(d)===ymd(n);
  if(flt==='month') return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth();
  return true;
}
function rDaily(){
  const list=entries.filter(e=>ymd(new Date(e.start_at))===day).sort((a,b)=>new Date(a.start_at)-new Date(b.start_at)), s=sum(list);
  const n=list.length;
  $('#main').innerHTML=`<input type="date" id="day" value="${day}" style="margin-bottom:14px">
  <div class="hero"><div class="ktop"><span class="klbl">Is din ka hisaab</span><span class="kchip">${n} ${n===1?'entry':'entries'}</span></div>
  <div class="big"><span class="cur">Rs</span>${_nf.format(Math.round(s.m))}</div>
  <div class="kfoot"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Total waqt</span><b>${dur(s.ms)}</b></div></div>`+
  (n?list.map(e=>`<div class="card row" data-e="${e.id}">${av(cn(e.customer_id))}<div class="grow"><b class="cn">${esc(cn(e.customer_id))}</b><div class="mu cm"><span>${tm(e.start_at)} se ${et(e)}</span><span>${dur(ms(e))}${disc(e)?' &middot; riyat':''}</span></div></div><b class="amt">${rs(amt(e))}</b><button class="xd xe" data-edit="${e.id}" aria-label="Edit">\u270F\uFE0F</button><button class="xd" data-del="${e.id}" aria-label="Delete">\u{1F5D1}</button></div>`).join(''):'<div class="empty">Is din ki koi entry nahi.</div>');
  $('#day').onchange=ev=>{day=ev.target.value||ymd(new Date());rDaily()};
  bindE();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#back').onclick=()=>go('khata');

/* ---- banda form ---- */
$('#cmX').onclick=()=>$('#cm').hidden=true;
$('#cmS').onclick=()=>{
  const name=$('#cmN').value.trim(), rate=parseFloat($('#cmR').value), opening=parseFloat($('#cmO').value)||0;
  if(!name||isNaN(rate)) return toast('Naam aur rate likhein');
  $('#cm').hidden=true;
  if(custEdit){mut('customers','upd',{id:custEdit,name,rate,opening});toast('Badal gaya (purani entries ka rate nahi badla)')}
  else{mut('customers','ins',{id:uid(),name,rate,opening});toast('Banda add ho gaya')}
};

/* ---- entry form ---- */
function calc(keep){
  const d=$('#fd').value,s=$('#fs').value,e=$('#fe').value,r=parseFloat($('#fr').value);
  if(!d||!s||!e||isNaN(r)){$('#prev').textContent='-';return null}
  const a=new Date(d+'T'+s), b=new Date(d+'T'+e);
  if(b.getTime()===a.getTime()){$('#prev').textContent='Shuru aur khatam ka waqt ek jaisa ha';return null}
  if(b<a) b.setDate(b.getDate()+1);
  const t=b-a, auto=Math.round(t/3600000*r);
  if(!manual&&!keep) $('#fa').value=auto;
  const fin=manual?(parseFloat($('#fa').value)||0):auto;
  $('#prev').textContent=dur(t)+'  =  '+rs(fin)+(manual&&fin!==auto?'  (riyat '+rs(auto-fin)+')':'');
  return {a,b,r,fin};
}
['fd','fs','fe','fr'].forEach(i=>$('#'+i).oninput=()=>calc());
$('#fa').oninput=()=>{manual=$('#fa').value!=='';calc(true)};
$('#fa').onblur=()=>calc();
$('#fc').onchange=()=>{const c=customers.find(x=>x.id===$('#fc').value);if(c)$('#fr').value=c.rate;calc()};
function openForm(e){
  if(!customers.length){toast('Pehle banda add karein');return}
  editId=e?e.id:null;
  $('#mT').textContent=e?'Entry theek karein':'Nayi entry';
  $('#fc').innerHTML=customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  $('#fDel').hidden=!e;
  if(e){
    const a=new Date(e.start_at),b=new Date(e.end_at);
    $('#fc').value=e.customer_id; $('#fd').value=ymd(a);
    $('#fs').value=p2(a.getHours())+':'+p2(a.getMinutes());
    $('#fe').value=isRun(e)?'':p2(b.getHours())+':'+p2(b.getMinutes()); $('#fr').value=e.rate;
  }else{
    const c=(view==='detail'&&customers.find(x=>x.id===cid))||customers[0];
    $('#fc').value=c.id; $('#fd').value=view==='daily'?day:ymd(new Date());
    $('#fs').value=''; $('#fe').value=''; $('#fr').value=c.rate;
  }
  manual=!!(e&&e.amount!=null); $('#fa').value=manual?e.amount:'';
  calc(); $('#modal').hidden=false;
}
$('#fab').onclick=()=>openForm(null);
$('#fX').onclick=()=>$('#modal').hidden=true;
$('#fSave').onclick=()=>{
  const v=calc(); if(!v) return toast('Sab cheezein bharein');
  const row={customer_id:$('#fc').value,start_at:v.a.toISOString(),end_at:v.b.toISOString(),rate:v.r,amount:manual?v.fin:null};
  if(view==='daily') day=$('#fd').value;
  $('#modal').hidden=true;
  mut('entries',editId?'upd':'ins',Object.assign({id:editId||uid()},row));
  toast('Save ho gaya');
};
$('#fDel').onclick=()=>{
  if(!confirm('Ye entry delete karein?')) return;
  $('#modal').hidden=true; mut('entries','del',{id:editId});
};

window.addEventListener('online',()=>{setStat();loadAll()});
window.addEventListener('offline',setStat);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#app').hidden&&Date.now()-_lastLoad>60000)loadAll()});
setInterval(()=>{if(Q.length)flush()},15000);
document.head.insertAdjacentHTML('beforeend','<style>#main{touch-action:pan-y}</style>');
const gname=()=>{const n=localStorage.getItem('tk_name');return n?', '+esc(n):''};
sb.auth.onAuthStateChange((ev,sess)=>{
  if(sess&&sess.user){
    localStorage.setItem('tk_name',(sess.user.user_metadata||{}).name||'');
    if(!localStorage.getItem('tk_login')) localStorage.setItem('tk_login',(sess.user.email||'').split('@')[0]);
  }else if(ev==='SIGNED_OUT'){localStorage.removeItem('tk_name');localStorage.removeItem('tk_login')}

/* ---- Setting ---- */
function rSettings(){
  const nm=localStorage.getItem('tk_name')||'', lg=localStorage.getItem('tk_login')||'', show=nm||lg||'Account';
  $('#main').innerHTML=`<div class="hero"><div class="hhead"><span class="av" style="background:${col(show)}">${esc((show.trim()[0]||'?').toUpperCase())}</span><div><b>${esc(show)}</b><small>Login: ${esc(lg)}</small></div></div></div>
  <div class="card"><b>Apna naam</b><div class="mu">Ye naam app mein salam ke saath dikhega.</div>
  <label>Naam</label><input id="sN" value="${esc(nm)}" maxlength="30"><button class="btn" id="sNs">Naam save karein</button></div>
  <div class="card"><b>Password badlein</b>
  <label>Maujooda password</label><input id="sP0" type="password" autocomplete="current-password">
  <label>Naya password (kam az kam 6 harf)</label><input id="sP1" type="password" autocomplete="new-password">
  <label>Naya password dobara</label><input id="sP2" type="password" autocomplete="new-password">
  <button class="btn" id="sPs">Password badlein</button></div>`;
  $('#sNs').onclick=async()=>{
    const n=$('#sN').value.trim();
    if(!navigator.onLine) return toast('Internet chahiye');
    const {error}=await sb.auth.updateUser({data:{name:n}});
    if(error) return toast(error.message);
    localStorage.setItem('tk_name',n); toast('Naam badal gaya'); render();
  };
  $('#sPs').onclick=async()=>{
    const old=$('#sP0').value, n1=$('#sP1').value, n2=$('#sP2').value;
    if(n1.length<6) return toast('Naya password kam az kam 6 harf');
    if(n1!==n2) return toast('Dono naye password barabar nahi');
    if(!navigator.onLine) return toast('Internet chahiye');
    const {data:{session}}=await sb.auth.getSession();
    if(!session) return toast('Dobara login karein');
    const r=await sb.auth.signInWithPassword({email:session.user.email,password:old});
    if(r.error) return toast('Maujooda password ghalat hai');
    const {error}=await sb.auth.updateUser({password:n1});
    if(error) return toast(error.message);
    ['#sP0','#sP1','#sP2'].forEach(i=>$(i).value=''); toast('Password badal gaya');
  };
}

/* ---- back: button aur slide ---- */
function goBack(){
  const open=[...document.querySelectorAll('.modal')].find(m=>!m.hidden);
  if(open){open.hidden=true;return true}
  if(view!=='khata'&&!$('#app').hidden){go('khata');return true}
  return false;
}
const AppP=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;
if(AppP) AppP.addListener('backButton',()=>{
  if(goBack()) return;
  try{AppP.minimizeApp()}catch(e){try{AppP.exitApp()}catch(e2){}}
});
(function(){
  let sx=0,sy=0,dx=0,on=false,lock=false;
  const el=()=>$('#main');
  const reset=()=>{const m=el();m.style.transition='';m.style.transform='';m.style.opacity=''};
  document.addEventListener('touchstart',e=>{
    const anyModal=[...document.querySelectorAll('.modal')].some(m=>!m.hidden);
    if($('#app').hidden||view==='khata'||view==='detail'||anyModal||e.touches.length!==1||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)){on=false;return}
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; dx=0; on=true; lock=false;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!on) return;
    const t=e.touches[0], x=t.clientX-sx, y=t.clientY-sy;
    if(!lock){
      if(Math.abs(y)>Math.abs(x)&&Math.abs(y)>12){on=false;return}
      if(x>14&&x>Math.abs(y)*1.4) lock=true; else return;
    }

  },{passive:true});

    if(!on||!lock){on=false;return}

const rrect=(x,a,b,w,h,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()};
const fitTxt=(x,t,m)=>{if(x.measureText(t).width<=m)return t;while(t.length>1&&x.measureText(t+'…').width>m)t=t.slice(0,-1);return t+'…'};

const sd=d=>_sf.format(new Date(d+'T00:00'));
const loadImg=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});

async function drawKhata(c){
  const W=1080,P=40,FONT='system-ui,-apple-system,Roboto,sans-serif',k=cs(c),q=ps(c);
  const today=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const days={},D=d=>days[d]=days[d]||{e:[],p:[]};
  entries.filter(e=>e.customer_id===c.id).forEach(e=>D(ymd(new Date(e.start_at))).e.push(e));
  payments.filter(z=>z.customer_id===c.id).forEach(z=>D(ymd(new Date(z.paid_at))).p.push(z));
  const keys=Object.keys(days).sort(), compact=keys.length>120;
  let bal=+c.opening||0; const rows=[];
  if(bal) rows.push({d:'',t:['Pehle ka hisaab (purani book)'],h:'',a:rs(bal),b:rs(bal),k:'o'});
  keys.forEach(d=>{
    const g=days[d], es=g.e.slice().sort((a,b)=>new Date(a.start_at)-new Date(b.start_at));
    if(es.length){
      const t=sum(es); bal+=t.m;
      rows.push({d:sd(d),t:compact?[es.length+' entry']:es.map(e=>tm(e.start_at)+' - '+et(e)+(disc(e)?' (riyat)':'')),h:hh(t.ms),a:rs(t.m),b:rs(bal),k:'e'});
    }
    g.p.forEach(z=>{
      if(z.applied) bal-=z.amount;
      if(z.applied) return;
      rows.push({d:sd(d),t:['Jama pesay'+(z.applied?'':' (abhi minus nahi)')],h:'',a:(z.applied?'- ':'')+rs(z.amount),b:rs(bal),k:'p'});
    });
  });
  const rowH=r=>Math.max(1,r.t.length)*30+22, TY=498;
  const H=TY+50+rows.reduce((a,r)=>a+rowH(r),0)+64+90;
  const sc=Math.min(2,15000/H);
  const cv=document.createElement('canvas'); cv.width=Math.round(W*sc); cv.height=Math.round(H*sc);
  const x=cv.getContext('2d'); x.scale(sc,sc);
  x.fillStyle='#fff'; x.fillRect(0,0,W,H);
  const gr=x.createLinearGradient(0,0,W,210); gr.addColorStop(0,'#0b5d6b'); gr.addColorStop(1,'#0e7490');
  x.fillStyle=gr; x.fillRect(0,0,W,210);
  x.save(); x.beginPath(); x.arc(P+70,105,70,0,Math.PI*2); x.closePath(); x.clip();
  const im=c.photo?await loadImg(c.photo):null;
  if(im) x.drawImage(im,P,35,140,140);
  else{x.fillStyle=col(c.name);x.fillRect(P,35,140,140);x.fillStyle='#fff';x.font='bold 64px '+FONT;x.textAlign='center';x.textBaseline='middle';x.fillText((c.name.trim()[0]||'?').toUpperCase(),P+70,108)}
  x.restore(); x.textAlign='left'; x.textBaseline='alphabetic';
  x.fillStyle='#fff'; x.font='bold 46px '+FONT; x.fillText(fitTxt(x,c.name,780),P+170,98);
  x.globalAlpha=.88; x.font='24px '+FONT;
  x.fillText('Rate Rs '+c.rate+' per ghanta',P+170,138);
  x.fillText('Tubewell Khata  ·  '+today,P+170,172); x.globalAlpha=1;
  const box=(bx,by,label,val,sub,hl)=>{
    x.fillStyle=hl?'#0b5d6b':'#e6f2f4'; rrect(x,bx,by,480,104,16); x.fill();
    x.textAlign='left'; x.fillStyle=hl?'#cfe9ee':'#6b7c80'; x.font='22px '+FONT; x.fillText(label,bx+24,by+34);
    x.fillStyle=hl?'#fff':'#122428'; x.font='bold 34px '+FONT; x.fillText(fitTxt(x,val,sub?260:430),bx+24,by+78);
    if(sub){x.textAlign='right';x.font='20px '+FONT;x.fillStyle=hl?'#cfe9ee':'#6b7c80';x.fillText(sub,bx+456,by+78)}
  };
  box(P,240,'Total pani',dur(k.ms),'');
  box(P+520,240,'Total paise (hisaab)',rs(k.m),k.o>0?'purana '+rs(k.o):'');
  box(P,364,q.pp>0?'Jama (abhi minus nahi)':'Baqaya pani',q.pp>0?rs(q.pp):dur(q.bms),'');
  box(P+520,364,'Baqaya',rs(q.bq),q.pp>0?dur(q.bms)+' pani':'',true);
  let y=TY;
  x.fillStyle='#0b5d6b'; x.fillRect(P,y,1000,50);
  x.fillStyle='#fff'; x.font='bold 22px '+FONT;
  x.textAlign='left'; x.fillText('Tarikh',P+12,y+33); x.fillText('Tafseel',P+180,y+33);
  x.textAlign='right'; x.fillText('Ghantay',P+630,y+33); x.fillText('Rakam',P+820,y+33); x.fillText('Baqaya',P+990,y+33);
  y+=50;
  rows.forEach((r,i)=>{
    const h=rowH(r);
    x.fillStyle=i%2?'#f4f8f9':'#fff'; x.fillRect(P,y,1000,h);
    x.fillStyle='#e1e8ea'; x.fillRect(P,y+h-1,1000,1);
    x.fillStyle=r.k==='p'?'#1f7a3d':(r.k==='o'?'#6b7c80':'#122428');
    x.font='21px '+FONT; x.textAlign='left';
    x.fillText(r.d,P+12,y+34);
    r.t.forEach((t,j)=>x.fillText(fitTxt(x,t,340),P+180,y+34+j*30));
    x.textAlign='right'; x.fillText(r.h,P+630,y+34);
    x.font='bold 21px '+FONT; x.fillText(r.a,P+820,y+34);
    x.fillStyle='#122428'; x.fillText(r.b,P+990,y+34);
    y+=h;
  });
  x.fillStyle='#e6f2f4'; x.fillRect(P,y,1000,64);
  x.fillStyle='#0b5d6b'; x.font='bold 24px '+FONT; x.textAlign='left'; x.fillText('Kul',P+12,y+41);
  x.textAlign='right'; x.fillText(hh(k.ms),P+630,y+41); x.fillText(rs(k.m),P+820,y+41); x.fillText(rs(q.bq),P+990,y+41);
  y+=64;
  x.fillStyle='#6b7c80'; x.font='20px '+FONT; x.textAlign='center';
  x.fillText('Ghantay = ghanta:minute   ·   Tubewell Khata app se  ·  '+today,W/2,y+46);
  return cv;
}

function rKhata(){
  let tq=0,tms=0;
  customers.forEach(c=>{const k=cs(c),q=ps(c);tq+=Math.max(0,q.bq);tms+=k.ms});
  const n=customers.length, runMap=new Map(); entries.forEach(e=>{if(isRun(e)&&!runMap.has(e.customer_id))runMap.set(e.customer_id,e)});

  <div class="kfoot"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Kul waqt</span><b data-lv="herot" data-base="${tms}" data-runs='${JSON.stringify(heroRuns)}'>${dur(tms)}</b></div></div>
  <div class="sec"><h2>Bandon ke khate</h2><button class="lnk" id="addC">+ Naya banda</button></div>`;

async function ensureProfile(){
  if(!navigator.onLine) return;
  try{
    const {data:{session}}=await sb.auth.getSession(); if(!session) return;
    const r=await sb.from('profiles').select('username').maybeSingle();
    if(r.error) return;
    if(r.data){localStorage.setItem('tk_login',r.data.username);return}
    const un=(session.user.email||'').split('@')[0];
    await sb.from('profiles').insert({username:un,email:session.user.email});
    localStorage.setItem('tk_login',un);
  }catch(e){}
}

async function doAuth(signup){
  const u=$('#u').value.trim().toLowerCase().replace(/\s+/g,''), pw=$('#pw').value;
  if(!u||pw.length<6) return toast('Username likhein, password kam az kam 6 harf');
  let email=mail(u);
  try{
    const r=await sb.rpc('login_email',{u});
    if(signup&&r.data) return toast('Ye username pehle se maujood hai');
    if(!signup&&r.data) email=r.data;
  }catch(e){}
  const fn=signup?sb.auth.signUp.bind(sb.auth):sb.auth.signInWithPassword.bind(sb.auth);
  const {error}=await fn({email,password:pw});
  if(error) return toast(error.message);
  boot();
}

const OTA_URL='https://touqeerbhutta.github.io/Tubewell-khata/version.json';
const UP=(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.CapacitorUpdater)||null;
let otaInfo=null, otaBusy=false, otaBundle=null;
document.head.insertAdjacentHTML('beforeend','<style>#otaBar{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:60;display:flex;align-items:center;gap:10px;justify-content:space-between;background:#0a5f6e;color:#fff;padding:12px 14px;border-radius:18px;box-shadow:0 10px 28px #0006;transform:translateY(300%);opacity:0;visibility:hidden;pointer-events:none;transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .3s,visibility 0s .45s;font-weight:600}#otaBar.on{transform:none;opacity:1;visibility:visible;pointer-events:auto;transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .3s,visibility 0s}#otaBar button{background:#fff;color:#0a5f6e;border:0;border-radius:12px;padding:9px 14px;font-weight:700;width:auto;margin:0}#otaBar button:disabled{opacity:.7}</style>');
document.body.insertAdjacentHTML('beforeend','<div id="otaBar"><span id="otaT">Naya update mil gaya</span><button id="otaB">Update karein</button></div>');
if(UP) setTimeout(()=>{try{UP.notifyAppReady()}catch(e){}},1500);

async function otaCurrent(){
  if(!UP) return '';
  try{const c=await UP.current();return (c.bundle&&c.bundle.version)||'builtin'}catch(e){return ''}
}
async function otaDl(){
  const o={url:otaInfo.url,version:String(otaInfo.version)};
  if(otaInfo.checksum){
    try{return await UP.download(Object.assign({checksum:otaInfo.checksum},o))}
    catch(e1){
      try{return await UP.download(o)}
      catch(e2){throw new Error('checksum ke saath: '+(e1&&e1.message||e1)+' || bina checksum: '+(e2&&e2.message||e2))}
    }
  }
  return UP.download(o);
}
async function otaPrefetch(){
  if(!UP||!otaInfo||otaBusy||otaBundle) return;
  try{
    otaBundle=await otaDl();
    try{await UP.next({id:otaBundle.id})}catch(e){}
  }catch(e){otaBundle=null}
}
async function otaCheck(manual){
  if(!UP){if(manual)toast('Update sirf APK app mein chalta hai');return}
  if(!navigator.onLine){if(manual)toast('Internet chahiye');return}
  if(otaBusy) return;
  try{
    const r=await fetch(OTA_URL+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json(), cur=await otaCurrent();
    if(j.version&&String(j.version)!==String(cur)){
      if(!otaInfo||otaInfo.version!==j.version){otaInfo=j;otaBundle=null}
      $('#otaBar').classList.add('on'); otaPrefetch();
    }else{
      otaInfo=null; $('#otaBar').classList.remove('on');
      if(manual) toast('App naya hai (version '+(cur==='builtin'?'APK wala':cur)+')');
    }
  }catch(e){if(manual)toast('Update check nahi hua: '+(e.message||e))}
}
$('#otaB').onclick=async()=>{
  if(!otaInfo||otaBusy||!UP) return;
  otaBusy=true; const b=$('#otaB'); b.disabled=true; b.textContent='Lag raha hai...';
  try{
    await flush();
    if(!otaBundle) otaBundle=await otaDl();
    await UP.set(otaBundle);
  }catch(e){otaBusy=false;b.disabled=false;b.textContent='Dobara koshish';{toast('Update nahi hua');alert('Update nahi hua: '+(e&&e.message||JSON.stringify(e)))}}
};

(function(){

  },{passive:true});

/* tez sync: ek saath 100 rows */
async function flush(){
  if(flushing||!Q.length) return; flushing=true;
  try{
    const {data:{session}}=await sb.auth.getSession(); if(!session) return;
    while(Q.length){
      const f=Q[0]; let n=1, r;
      if(f.op==='ins'){
        while(n<100&&Q[n]&&Q[n].op==='ins'&&Q[n].t===f.t) n++;
        r=await sb.from(f.t).upsert(Q.slice(0,n).map(x=>x.row));
        if(r.error&&!isNet(r.error)&&n>1){
          for(let i=0;i<n;i++){
            const q=await sb.from(f.t).upsert(Q[i].row);
            if(q.error&&isNet(q.error)){r=q;break}
            if(q.error) toast('Sync masla: '+q.error.message);
          }
          if(!(r.error&&isNet(r.error))) r={error:null};
        }
      }else if(f.op==='upd'){const {id,...rest}=f.row; r=await sb.from(f.t).update(rest).eq('id',id)}
      else r=await sb.from(f.t).delete().eq('id',f.row.id);
      if(r.error){ if(isNet(r.error)) break; toast('Sync masla: '+r.error.message) }
      Q.splice(0,n); saveLocal(); setStat();
    }
  }catch(e){}finally{flushing=false;setStat()}
}
function bulkIns(t,rows){
  const arr=t==='customers'?customers:t==='payments'?payments:entries, ids=new Set(arr.map(x=>x.id));
  rows.forEach(r=>{if(!ids.has(r.id)){arr.push(r);ids.add(r.id)}Q.push({t,op:'ins',row:r})});
}

  $('#sm h3').textContent='Rasid'; $('#sm').hidden=false;
  $('#sMsg').textContent='Rasid ban rahi hai...'; $('#shot').removeAttribute('src');
  try{
    const cv=await drawReceipt(c,z); shotURL=cv.toDataURL('image/png');
    shotName='rasid-'+(c.name.replace(/[^\w]+/g,'-').replace(/^-|-$/g,'')||'banda')+'-'+ymd(new Date(z.paid_at));
    $('#shot').src=shotURL; $('#sMsg').textContent='Tayyar hai. Neeche "Share / Save karein" dabayen.';
  }catch(e){$('#sMsg').textContent='Masla: '+(e.message||e)}
}
const _os10=openShot;
openShot=function(c){$('#sm h3').textContent='Khata ki tasveer';return _os10(c)};

$('#pX').insertAdjacentHTML('beforebegin','<button class="btn s" id="pRec" hidden>Rasid banayein</button>');
$('#pRec').onclick=()=>{const z=payments.find(p=>p.id===payEdit); if(z){$('#pm').hidden=true;openReceipt(z)}};
const _op10=openPay;
openPay=function(x){_op10(x);$('#pRec').hidden=!x};
const _psv=$('#pSave').onclick;
$('#pSave').onclick=()=>{
  const isNew=!payEdit, n0=payments.length;
  _psv();
  if(isNew&&payments.length>n0){const z=payments[payments.length-1]; actToast('Jama save ho gaya','Rasid banayein',()=>openReceipt(z),9000)}
};

/* ---- Liquid Glass (Setting mein on/off + intensity) ---- */
function glassGet(){try{return JSON.parse(localStorage.getItem('tk_glass')||'{"on":true,"v":80}')}catch(e){return{on:true,v:80}}}
function glassSet(g){localStorage.setItem('tk_glass',JSON.stringify(g));const h=document.documentElement;h.classList.toggle('glass',!!g.on);h.style.setProperty('--gl',(g.v/100).toFixed(2))}
const _rsGl=rSettings;
rSettings=function(){
  _rsGl();
  const g=glassGet();
  $('#main').insertAdjacentHTML('afterbegin',`<div class="card" id="glCard"><b>Liquid Glass</b><div class="mu">Sheesha jaisa look (iOS style)</div>
  <div class="chips" style="margin-top:10px"><button data-gl="1" class="${g.on?'on':''}">On</button><button data-gl="0" class="${g.on?'':'on'}">Off</button></div>
  <div id="glRow" style="${g.on?'':'opacity:.45;pointer-events:none'}"><label style="display:flex;justify-content:space-between"><span>Intensity</span><span id="glV">${g.v}%</span></label>
  <input type="range" id="glR" min="10" max="100" step="5" value="${g.v}"></div></div>`);
  document.querySelectorAll('[data-gl]').forEach(b=>b.onclick=()=>{const o=glassGet();o.on=b.dataset.gl==='1';glassSet(o);rSettings()});
  $('#glR').oninput=e=>{const o=glassGet();o.v=+e.target.value;$('#glV').textContent=o.v+'%';glassSet(o)};
};

/* ---- speed: ek render ke dauran hisaab ek hi baar nikalta ha ---- */
const _rFast=render;
render=function(){_inR=true;_grpE=null;_csM=new Map();try{_rFast()}finally{_inR=false;_grpE=null;_csM=null}liveSync()};

/* ---- khate ki screen: tasveer jaisa jadwal (khoobsurat) ---- */
document.head.insertAdjacentHTML('beforeend','<style>.khd{display:flex;align-items:center;gap:14px;border-radius:22px;padding:16px;color:#fff;background:linear-gradient(135deg,#08505d,#0f8aa0);box-shadow:0 12px 26px rgba(10,95,110,.28);margin-bottom:12px}.khd .av{width:64px;height:64px;font-size:26px;box-shadow:0 0 0 3px rgba(255,255,255,.55)}.khd b{display:block;font-size:22px}.khd span{display:block;font-size:13px;opacity:.92;margin-top:1px}.kb>div{border-radius:18px;padding:14px}.kb b{font-size:17px}.kb .hl{box-shadow:0 8px 18px rgba(10,95,110,.25)}.kr{grid-template-columns:56px 1fr 40px 62px 68px}.kd{font-weight:700}.rg{line-height:1.3;margin-bottom:3px}.rg .to{display:block;color:var(--mu)}.hint{font-size:12.5px;color:var(--mu);margin:0 4px 8px;line-height:1.5}.kt{box-shadow:0 8px 22px rgba(10,95,110,.12)}</style>');

function rDetail(){
  const c=customers.find(x=>x.id===cid);
  if(!c){view='khata';return render()}
  const k=cs(c), q=ps(c), all=flt==='all', asc=localStorage.getItem('tk_sort')==='asc';
  const run=entries.find(e=>e.customer_id===c.id&&isRun(e));
  const rst=run?new Date(run.start_at).getTime():0, lv=(k,b)=>run?` data-lv="${k}" data-base="${b}" data-s="${rst}" data-r="${run.rate}"`:'';
  const today=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const days={},D=d=>days[d]=days[d]||{e:[],p:[]};
  entries.filter(e=>e.customer_id===c.id).forEach(e=>D(ymd(new Date(e.start_at))).e.push(e));
  payments.filter(z=>z.customer_id===c.id).forEach(z=>D(ymd(new Date(z.paid_at))).p.push(z));
  let bal=+c.opening||0; const rows=[];
  Object.keys(days).sort().forEach(d=>{
    const g=days[d], es=g.e.slice().sort((a,b)=>new Date(a.start_at)-new Date(b.start_at));
    if(es.length){const t=sum(es);bal+=t.m;rows.push({k:'e',d,es,ms:t.ms,a:t.m,b:bal})}
    g.p.slice().sort((a,b)=>new Date(a.paid_at)-new Date(b.paid_at)).forEach(z=>{if(z.applied)bal-=z.amount;rows.push({k:'p',d,z,b:bal})});
  });
  const sel=rows.filter(r=>inFlt({start_at:r.d+'T12:00:00'}));
  const tms=sel.reduce((a,r)=>a+(r.ms||0),0), tam=sel.reduce((a,r)=>a+(r.k==='e'?r.a:0),0);
  const ord=(asc?sel:sel.slice().reverse()).filter(r=>!(r.k==='p'&&r.z.applied));
  const row=(r,i)=>{
    const alt=i%2?' alt':'';
    if(r.k==='e') return `<div class="kr${alt}"><div class="kd">${sd(r.d)}</div><div>${r.es.map(e=>`<div class="rg" data-e="${e.id}"><b>${tm(e.start_at)}</b><button class="xd xe" data-edit="${e.id}" aria-label="Edit">\u270F\uFE0F</button><span class="to${isRun(e)?' wr':''}">&rarr; ${et(e)}${disc(e)?' <span class="mu">(riyat)</span>':''}</span><button class="xd" data-del="${e.id}" aria-label="Delete">\u{1F5D1}</button></div>`).join('')}</div><div>${hh(r.ms)}</div><div><b>${num(r.a)}</b></div><div>${num(r.b)}</div></div>`;
    return `<div class="kr pay${alt}" data-p="${r.z.id}"><div class="kd">${sd(r.d)}</div><div><b>Jama pesay</b>${r.z.applied?'':'<br><span class="mu">(abhi minus nahi)</span>'}</div><div></div><div><b>${r.z.applied?'- ':''}${num(r.z.amount)}</b></div><div>${num(r.b)}</div></div>`;
  };
  const opn=(all&&k.o>0)?`<div class="kr opn" id="opn"><div></div><div><b>Pehle ka hisaab</b><br><span class="mu">(purani book)</span></div><div></div><div><b>${num(k.o)}</b></div><div>${num(k.o)}</div></div>`:'';
  const body=(asc?opn:'')+ord.map(row).join('')+(asc?'':opn);
  const h=`<div class="khd">${av(c.name)}<div class="grow"><b>${esc(c.name)}</b><span>Rate Rs ${c.rate} per ghanta</span><span>Tubewell Khata &middot; ${today}</span></div></div>
  <div class="kb">
  <div><small>Total pani</small><b${lv('tp',k.ms)}>${dur(k.ms)}</b></div>
  <div><small>Total paise (hisaab)</small><b${lv('tm',k.m)}>${rs(k.m)}</b>${k.o>0?`<i>purana ${rs(k.o)}</i>`:''}</div>
  ${q.pp>0?`<div><small>Jama (minus nahi)</small><b>${rs(q.pp)}</b></div>`:''}
  <div class="hl"><small>Baqaya</small><b${lv('bq',q.bq)}>${rs(q.bq)}</b><i${lv('bt',q.bms)}>${dur(q.bms)} pani</i></div></div>
  ${run?`<div class="runc"><div><b>Tubewell chal raha ha</b><small>Shuru: ${ymd(new Date(run.start_at))===ymd(new Date())?'':sd(ymd(new Date(run.start_at)))+', '}${tm(run.start_at)}</small><div class="lv"><span${lv('t',0)}>${durS(Date.now()-rst)}</span><b${lv('m',0)}>${rs(lvMoney(Date.now()-rst,run.rate))}</b></div></div><button class="stp" id="stopT">Band karo</button></div>`:`<button class="strt" id="startT"><span class="em">&#9654;</span> Tubewell shuru karein</button>`}
  <div class="bigb"><button class="bb w" id="addE"><span class="em">💧</span>Pani ki nayi entry</button><button class="bb g" id="payBtn"><span class="em">💰</span>Pesay jama karein</button></div>
  ${q.pp>0?`<div class="pend"><b>${rs(q.pp)}</b> jama hain, lekin abhi hisaab se kam nahi kiye<button class="btn" id="applyAll">Ab hisaab se kam karein</button></div>`:''}
  <div class="chips">${[['all','Sab'],['month','Is mahine'],['today','Aaj']].map(([x,l])=>`<button class="${flt===x?'on':''}" data-f="${x}">${l}</button>`).join('')}</div>
  <div class="sec" style="margin:14px 4px 6px"><h2>Hisaab</h2><button class="lnk" id="sortB">${asc?'Purane pehle':'Naye pehle'} ⇅</button></div>
  <div class="hint">Har line ek din ka hisaab hai: kab pani diya, kitne ghantay, kitne paise, aur uske baad kitne paise baqi.</div>
  <div class="kt"><div class="kr kh"><div>Tarikh</div><div>Tafseel</div><div>Ghantay</div><div>Rakam</div><div>Baqaya</div></div>
  ${body||'<div class="empty" style="padding:22px;border:0">Is muddat mein koi entry nahi.</div>'}
  <div class="kr tot"><div>${all?'Kul':'Total'}</div><div></div><div>${hh(all?k.ms:tms)}</div><div>${num(all?k.m:tam)}</div><div>${num(q.bq)}</div></div></div>
  ${payments.some(z=>z.customer_id===c.id)?`<button class="btn s" id="jhBtn" style="margin:0 0 10px"><span class="em">&#128176;</span> Jama ki list (theek / delete)</button>`:''}
  <button class="btn s" id="shotBtn" style="margin:0 0 10px"><span class="em">📷</span> Khata ki tasveer banayen</button>
  <div class="two2"><button class="btn s" id="eC">Naam / rate / purana hisaab badlein</button><button class="btn d" id="dC">Banda hatayen</button></div>`;
  $('#main').innerHTML=h;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{flt=b.dataset.f;render()});
  document.querySelectorAll('[data-p]').forEach(el=>el.onclick=()=>openPay(payments.find(x=>x.id===el.dataset.p)));
  $('#addE').onclick=()=>openForm(null);
  if($('#startT')) $('#startT').onclick=()=>openTW(c,null);
  if($('#stopT')) $('#stopT').onclick=()=>openTW(c,run);
  $('#payBtn').onclick=()=>openPay(null);
  if($('#jhBtn')) $('#jhBtn').onclick=openJH;
  $('#shotBtn').onclick=()=>openShot(customers.find(x=>x.id===cid));
  if($('#applyAll')) $('#applyAll').onclick=()=>{
    if(!confirm('Jama pesay hisaab se minus kar dein?')) return;
    payments.filter(x=>x.customer_id===cid&&!x.applied).forEach(x=>mut('payments','upd',{id:x.id,applied:true}));
    toast('Minus ho gaye');
  };
  $('#sortB').onclick=()=>{localStorage.setItem('tk_sort',asc?'desc':'asc');render()};
  $('#eC').onclick=()=>openCust(c);
  if($('#opn')) $('#opn').onclick=()=>openCust(c);
  $('#dC').onclick=()=>{
    if(!confirm('Is bande ka sara hisaab bhi delete ho jayega. Pakka?')) return;
    view='khata'; mut('customers','del',{id:c.id});
  };
  bindE();
}

boot();
</script>
