<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5d6b">
<title>Tubewell Khata</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--p:#0b5d6b;--p2:#e3f1f3;--bg:#f3f6f7;--ink:#14272b;--mu:#66787c;--ln:#dde5e7;--red:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
[hidden]{display:none!important}
input,select,button{font:inherit}
input,select{width:100%;padding:12px;border:1px solid var(--ln);border-radius:10px;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--p);color:#fff;font-weight:600;width:100%;margin-top:10px}
.btn.s{background:var(--p2);color:var(--p)}.btn.d{background:#fdecea;color:var(--red)}
header{background:var(--p);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}
header button{background:none;border:0;color:#fff;opacity:.85}
main{padding:14px 14px 160px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:13px;border:0;background:none;color:var(--mu);font-weight:600}
nav button.on{color:var(--p);box-shadow:inset 0 -3px 0 var(--p)}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.sum div{background:var(--p);color:#fff;border-radius:14px;padding:14px}
.sum small{opacity:.8;display:block}.sum b{font-size:21px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center}
.mu{color:var(--mu);font-size:13px}
.fab{position:fixed;right:16px;bottom:calc(68px + env(safe-area-inset-bottom));background:var(--p);color:#fff;border:0;border-radius:28px;padding:15px 22px;font-weight:700;box-shadow:0 4px 14px #0b5d6b66}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:9}
.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prev{background:var(--p2);color:var(--p);border-radius:12px;padding:12px;margin-top:12px;font-weight:700;text-align:center}
#auth{min-height:100vh;display:flex;align-items:center;padding:20px}
#auth .card{width:100%;max-width:380px;margin:auto;padding:22px}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#14272b;color:#fff;padding:10px 16px;border-radius:20px;z-index:20}
</style></head>
<body>
<div id="auth" hidden><div class="card">
<h2 style="margin:0 0 4px;color:var(--p)">Tubewell Khata</h2>
<div class="mu">Login karein ya naya account banayen</div>
<label>Username</label><input id="u" autocapitalize="none" autocomplete="username">
<label>Password (kam az kam 6 harf)</label><input id="pw" type="password" autocomplete="current-password">
<button class="btn" id="bLogin">Login</button>
<button class="btn s" id="bSign">Naya account banayen</button>
</div></div>

<div id="app" hidden>
<header><h1 id="ttl">Tubewell Khata</h1><button id="bOut">Logout</button></header>
<main>
<section id="v-home">
<input type="date" id="day">
<div class="sum"><div><small>Total waqt</small><b id="hT">0</b></div><div><small>Total paise</small><b id="hM">Rs 0</b></div></div>
<div id="hList"></div>
</section>
<section id="v-cust" hidden>
<div class="card"><label style="margin-top:0">Naam</label><input id="cn"><label>Rate (Rs per ghanta)</label><input id="cr" type="number" inputmode="decimal"><button class="btn" id="cAdd">Banda add karein</button></div>
<div id="cList"></div>
</section>
<section id="v-rep" hidden>
<div class="g2"><div><label style="margin-top:0">Se</label><input type="date" id="rf"></div><div><label style="margin-top:0">Tak</label><input type="date" id="rt"></div></div>
<button class="btn" id="rGo">Report dekhein</button>
<div class="sum"><div><small>Total waqt</small><b id="rT">0</b></div><div><small>Total paise</small><b id="rM">Rs 0</b></div></div>
<div id="rList"></div>
</section>
</main>
<button class="fab" id="fab">+ Nayi entry</button>
<nav><button data-v="home" class="on">Hisaab</button><button data-v="cust">Bande</button><button data-v="rep">Report</button></nav>

<div class="modal" id="modal" hidden><div class="sheet">
<h3 style="margin:0" id="mT">Nayi entry</h3>
<label>Banda</label><select id="fc"></select>
<label>Tarikh</label><input type="date" id="fd">
<div class="g2"><div><label>Kab chalai</label><input type="time" id="fs"></div><div><label>Kab band ki</label><input type="time" id="fe"></div></div>
<label>Rate (Rs per ghanta)</label><input type="number" id="fr" inputmode="decimal">
<div class="prev" id="prev">-</div>
<button class="btn" id="fSave">Save karein</button>
<button class="btn d" id="fDel" hidden>Delete karein</button>
<button class="btn s" id="fX">Band karein</button>
</div></div>
</div>
<div id="toast" hidden></div>

<script>
const SB_URL='https://ffxwoxdtjxajcrkluofz.supabase.co', SB_KEY='sb_publishable_poiE0k3vg5nHxji7rr7K7Q_o839zR29';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s), p2=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const tm=iso=>new Date(iso).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const dur=ms=>{const m=Math.round(ms/60000);return Math.floor(m/60)+' ghanta '+p2(m%60)+' min'};
const money=(ms,r)=>Math.round(ms/3600000*r);
let customers=[], entries=[], editId=null;

function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,2500)}
const mail=u=>u.trim().toLowerCase().replace(/\s+/g,'')+'@tubewell.app';

async function doAuth(signup){
  const u=$('#u').value, pw=$('#pw').value;
  if(!u.trim()||pw.length<6) return toast('Username likhein, password kam az kam 6 harf');
  const fn=signup?sb.auth.signUp.bind(sb.auth):sb.auth.signInWithPassword.bind(sb.auth);
  const {error}=await fn({email:mail(u),password:pw});
  if(error) return toast(error.message);
  boot();
}
$('#bLogin').onclick=()=>doAuth(false);
$('#bSign').onclick=()=>doAuth(true);
$('#bOut').onclick=async()=>{await sb.auth.signOut();boot()};

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  $('#auth').hidden=!!session; $('#app').hidden=!session;
  if(!session) return;
  $('#day').value=ymd(new Date());
  const t=ymd(new Date()); $('#rf').value=t.slice(0,8)+'01'; $('#rt').value=t;
  await loadCust(); await loadDay();
}
async function loadCust(){
  const {data,error}=await sb.from('customers').select('*').order('name');
  if(error) return toast(error.message);
  customers=data; renderCust();
}
async function fetchEntries(from,to){
  const a=new Date(from+'T00:00:00'), b=new Date(to+'T00:00:00'); b.setDate(b.getDate()+1);
  const {data,error}=await sb.from('entries').select('*, customers(name)')
    .gte('start_at',a.toISOString()).lt('start_at',b.toISOString()).order('start_at');
  if(error){toast(error.message);return []} return data;
}
async function loadDay(){entries=await fetchEntries($('#day').value,$('#day').value);renderDay()}

function entryRow(e){
  const ms=new Date(e.end_at)-new Date(e.start_at);
  return `<div class="card item" data-id="${e.id}"><div><b>${esc(e.customers?.name||'')}</b>
  <div class="mu">${tm(e.start_at)} se ${tm(e.end_at)} &middot; ${dur(ms)}</div></div>
  <b>Rs ${money(ms,e.rate).toLocaleString()}</b></div>`;
}
function totals(list){let t=0,m=0;list.forEach(e=>{const ms=new Date(e.end_at)-new Date(e.start_at);t+=ms;m+=money(ms,e.rate)});return [t,m]}
function renderDay(){
  const [t,m]=totals(entries);
  $('#hT').textContent=dur(t); $('#hM').textContent='Rs '+m.toLocaleString();
  $('#hList').innerHTML=entries.length?entries.map(entryRow).join(''):'<div class="card mu">Is din ki koi entry nahi. "+ Nayi entry" dabayen.</div>';
  document.querySelectorAll('#hList [data-id]').forEach(el=>el.onclick=()=>openForm(entries.find(x=>x.id===el.dataset.id)));
}
function renderCust(){
  $('#cList').innerHTML=customers.length?customers.map(c=>`<div class="card item"><div><b>${esc(c.name)}</b><div class="mu">Rs ${c.rate} per ghanta</div></div><button class="btn d" style="width:auto;margin:0" data-del="${c.id}">Hatayen</button></div>`).join(''):'<div class="card mu">Abhi koi banda nahi. Upar se add karein.</div>';
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Is bande ka sara hisaab bhi delete ho jayega. Pakka?'))return;
    const {error}=await sb.from('customers').delete().eq('id',b.dataset.del);
    if(error)return toast(error.message); await loadCust(); loadDay();
  });
}
$('#cAdd').onclick=async()=>{
  const name=$('#cn').value.trim(), rate=parseFloat($('#cr').value);
  if(!name||isNaN(rate)) return toast('Naam aur rate likhein');
  const {error}=await sb.from('customers').insert({name,rate});
  if(error) return toast(error.message);
  $('#cn').value='';$('#cr').value=''; loadCust();
};

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['home','cust','rep'].forEach(v=>$('#v-'+v).hidden=v!==b.dataset.v);
  $('#fab').hidden=b.dataset.v==='cust'||b.dataset.v==='rep';
});
$('#day').onchange=loadDay;

$('#rGo').onclick=async()=>{
  const list=await fetchEntries($('#rf').value,$('#rt').value);
  const [t,m]=totals(list); $('#rT').textContent=dur(t); $('#rM').textContent='Rs '+m.toLocaleString();
  const per={};
  list.forEach(e=>{const n=e.customers?.name||'';const ms=new Date(e.end_at)-new Date(e.start_at);
    per[n]=per[n]||{ms:0,m:0};per[n].ms+=ms;per[n].m+=money(ms,e.rate)});
  $('#rList').innerHTML=Object.entries(per).map(([n,v])=>`<div class="card item"><div><b>${esc(n)}</b><div class="mu">${dur(v.ms)}</div></div><b>Rs ${v.m.toLocaleString()}</b></div>`).join('')||'<div class="card mu">Is muddat mein koi entry nahi.</div>';
};

function calc(){
  const d=$('#fd').value,s=$('#fs').value,e=$('#fe').value,r=parseFloat($('#fr').value);
  if(!d||!s||!e||isNaN(r)){$('#prev').textContent='-';return null}
  const a=new Date(d+'T'+s), b=new Date(d+'T'+e);
  if(b<=a) b.setDate(b.getDate()+1);
  const ms=b-a; $('#prev').textContent=dur(ms)+'  =  Rs '+money(ms,r).toLocaleString();
  return {a,b,r};
}
['fd','fs','fe','fr'].forEach(i=>$('#'+i).oninput=calc);
$('#fc').onchange=()=>{const c=customers.find(x=>x.id===$('#fc').value);if(c)$('#fr').value=c.rate;calc()};

function openForm(e){
  if(!customers.length){toast('Pehle "Bande" tab mein banda add karein');return}
  editId=e?e.id:null;
  $('#mT').textContent=e?'Entry theek karein':'Nayi entry';
  $('#fc').innerHTML=customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  $('#fDel').hidden=!e;
  if(e){
    const a=new Date(e.start_at),b=new Date(e.end_at);
    $('#fc').value=e.customer_id; $('#fd').value=ymd(a);
    $('#fs').value=p2(a.getHours())+':'+p2(a.getMinutes());
    $('#fe').value=p2(b.getHours())+':'+p2(b.getMinutes()); $('#fr').value=e.rate;
  }else{
    $('#fd').value=$('#day').value; $('#fs').value=''; $('#fe').value='';
    $('#fr').value=customers[0].rate;
  }
  calc(); $('#modal').hidden=false;
}
$('#fab').onclick=()=>openForm(null);
$('#fX').onclick=()=>$('#modal').hidden=true;
$('#fSave').onclick=async()=>{
  const v=calc(); if(!v) return toast('Sab cheezein bharein');
  const row={customer_id:$('#fc').value,start_at:v.a.toISOString(),end_at:v.b.toISOString(),rate:v.r};
  const q=editId?sb.from('entries').update(row).eq('id',editId):sb.from('entries').insert(row);
  const {error}=await q; if(error) return toast(error.message);
  $('#modal').hidden=true; $('#day').value=$('#fd').value; loadDay(); toast('Save ho gaya');
};
$('#fDel').onclick=async()=>{
  if(!confirm('Ye entry delete karein?'))return;
  const {error}=await sb.from('entries').delete().eq('id',editId);
  if(error)return toast(error.message); $('#modal').hidden=true; loadDay();
};
boot();
</script>
</body></html>
